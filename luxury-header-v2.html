<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایران اِفیکس - هوشمندانه معامله کنید</title>
    
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v40.0.0/dist/font-face.css" rel="stylesheet">
    
    <!-- Chart.js برای نمودار زنده -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0a0e1a;
            color: #ffffff;
            direction: rtl;
            overflow-x: hidden;
        }

        /* ============================================
           HEADER WRAPPER - طراحی شیشه‌ای فوق لوکس
           ============================================ */
        .lux-header-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            background: linear-gradient(180deg, 
                rgba(10, 15, 30, 0.98) 0%, 
                rgba(15, 23, 42, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            box-shadow: 
                0 4px 30px rgba(0, 0, 0, 0.5),
                0 0 60px rgba(255, 215, 0, 0.05),
                inset 0 -1px 0 rgba(255, 215, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lux-header-wrapper.scrolled {
            background: linear-gradient(180deg, 
                rgba(5, 8, 18, 0.99) 0%, 
                rgba(10, 15, 30, 0.97) 100%);
            box-shadow: 
                0 8px 40px rgba(0, 0, 0, 0.7),
                0 0 80px rgba(255, 215, 0, 0.08),
                inset 0 -1px 0 rgba(255, 215, 0, 0.1);
        }

        /* ============================================
           MAIN CONTAINER
           ============================================ */
        .lux-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ============================================
           TOP BAR - لوگو، قیمت‌ها و دکمه ورود
           ============================================ */
        .lux-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            gap: 24px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.08);
        }

        /* --- LOGO SECTION --- */
        .lux-logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            color: inherit;
            position: relative;
            padding: 8px 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.03) 0%, 
                rgba(255, 140, 0, 0.02) 100%);
            border: 1px solid rgba(255, 215, 0, 0.1);
            transition: all 0.3s ease;
        }

        .lux-logo-section:hover {
            background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.08) 0%, 
                rgba(255, 140, 0, 0.05) 100%);
            border-color: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
            transform: translateY(-2px);
        }

        .lux-logo-img {
            height: 50px;
            width: auto;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3));
            transition: all 0.3s ease;
        }

        .lux-logo-section:hover .lux-logo-img {
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
            transform: scale(1.05);
        }

        .lux-brand-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lux-brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, 
                #ffd700 0%, 
                #ffec8b 25%, 
                #ffd700 50%, 
                #ff8c00 75%, 
                #ffd700 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: lux-shimmer 3s linear infinite;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        @keyframes lux-shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .lux-brand-tagline {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.5px;
            position: relative;
            display: inline-block;
        }

        .lux-brand-tagline::before {
            content: '';
            position: absolute;
            right: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700;
        }

        /* ============================================
           LIVE CHART SECTION - نمودار زنده طلا
           ============================================ */
        .lux-chart-section {
            flex: 1;
            max-width: 500px;
            min-height: 80px;
            position: relative;
            background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.02) 0%, 
                rgba(255, 140, 0, 0.01) 100%);
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.08);
            padding: 12px 16px;
            overflow: hidden;
        }

        .lux-chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .lux-chart-title {
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lux-live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(39, 174, 96, 0.15);
            border-radius: 12px;
            border: 1px solid rgba(39, 174, 96, 0.3);
        }

        .lux-live-dot {
            width: 6px;
            height: 6px;
            background: #27ae60;
            border-radius: 50%;
            animation: lux-pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 10px #27ae60;
        }

        @keyframes lux-pulse {
            0%, 100% { 
                opacity: 1;
                transform: scale(1);
            }
            50% { 
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .lux-live-text {
            font-size: 10px;
            font-weight: 700;
            color: #27ae60;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lux-current-price {
            font-size: 18px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            font-variant-numeric: tabular-nums;
        }

        .lux-chart-canvas-wrapper {
            position: relative;
            height: 50px;
            width: 100%;
        }

        /* ============================================
           CTA BUTTON - دکمه ورود
           ============================================ */
        .lux-cta-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, 
                #ffd700 0%, 
                #ff8c00 50%, 
                #ffd700 100%);
            background-size: 200% auto;
            color: #0a0e1a;
            text-decoration: none;
            font-size: 15px;
            font-weight: 800;
            padding: 14px 28px;
            border-radius: 30px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            box-shadow: 
                0 4px 20px rgba(255, 215, 0, 0.3),
                0 0 40px rgba(255, 215, 0, 0.1),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            animation: lux-gradient-flow 3s ease-in-out infinite;
        }

        @keyframes lux-gradient-flow {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 200% center; }
        }

        .lux-cta-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.4), 
                transparent);
            transition: left 0.5s ease;
        }

        .lux-cta-btn:hover::before {
            left: 100%;
        }

        .lux-cta-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 8px 30px rgba(255, 215, 0, 0.5),
                0 0 60px rgba(255, 215, 0, 0.2),
                inset 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .lux-cta-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .lux-cta-icon {
            width: 20px;
            height: 20px;
            stroke: #0a0e1a;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: all 0.3s ease;
        }

        .lux-cta-btn:hover .lux-cta-icon {
            transform: translateX(-3px);
        }

        /* ============================================
           NAVIGATION BAR
           ============================================ */
        .lux-nav-bar {
            display: flex;
            justify-content: center;
            padding: 12px 0;
        }

        .lux-nav-list {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .lux-nav-item a {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 25px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .lux-nav-item a::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.1) 0%, 
                rgba(255, 140, 0, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 25px;
        }

        .lux-nav-item a:hover::before {
            opacity: 1;
        }

        .lux-nav-item a:hover {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transform: translateY(-2px);
        }

        .lux-nav-icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: all 0.3s ease;
        }

        .lux-nav-item a:hover .lux-nav-icon {
            transform: scale(1.1) rotate(5deg);
            stroke: #ffd700;
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 1024px) {
            .lux-container {
                padding: 0 16px;
            }

            .lux-top-bar {
                flex-wrap: wrap;
                gap: 16px;
            }

            .lux-chart-section {
                max-width: 400px;
            }

            .lux-brand-title {
                font-size: 22px;
            }
        }

        @media (max-width: 768px) {
            .lux-top-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 12px 0;
            }

            .lux-logo-section {
                justify-content: center;
                padding: 12px;
            }

            .lux-chart-section {
                max-width: 100%;
                min-height: 70px;
            }

            .lux-cta-btn {
                justify-content: center;
                padding: 12px 24px;
                font-size: 14px;
            }

            .lux-nav-list {
                flex-wrap: wrap;
                justify-content: center;
                padding: 6px 12px;
                gap: 6px;
            }

            .lux-nav-item a {
                font-size: 13px;
                padding: 8px 16px;
            }

            .lux-brand-title {
                font-size: 20px;
            }

            .lux-logo-img {
                height: 40px;
            }
        }

        @media (max-width: 480px) {
            .lux-container {
                padding: 0 12px;
            }

            .lux-nav-list {
                gap: 4px;
                padding: 4px 8px;
            }

            .lux-nav-item a {
                font-size: 12px;
                padding: 6px 12px;
            }

            .lux-current-price {
                font-size: 16px;
            }

            .lux-chart-canvas-wrapper {
                height: 40px;
            }
        }

        /* ============================================
           PLACEHOLDER SPACER
           ============================================ */
        .lux-header-spacer {
            height: 140px;
            visibility: hidden;
        }

        @media (max-width: 768px) {
            .lux-header-spacer {
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- Header Wrapper -->
    <div class="lux-header-wrapper" id="luxHeader">
        <div class="lux-container">
            <!-- Top Bar -->
            <div class="lux-top-bar">
                <!-- Logo Section -->
                <a href="https://iranfxapp.ir" class="lux-logo-section">
                    <img src="https://iranfxapp.ir/wp-content/uploads/2025/11/icon-header.png" alt="ایران اِفیکس" class="lux-logo-img">
                    <div class="lux-brand-info">
                        <span class="lux-brand-title">ایران اِفیکس</span>
                        <span class="lux-brand-tagline">هوشمندانه معامله کنید</span>
                    </div>
                </a>

                <!-- Live Chart Section -->
                <div class="lux-chart-section">
                    <div class="lux-chart-header">
                        <div class="lux-chart-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2">
                                <path d="M12 2v20M2 12h20"/>
                                <circle cx="12" cy="12" r="10" stroke="#ffd700" stroke-width="1.5" fill="none"/>
                            </svg>
                            طلای جهانی (XAU/USD)
                        </div>
                        <div class="lux-live-indicator">
                            <div class="lux-live-dot"></div>
                            <span class="lux-live-text">LIVE</span>
                        </div>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span class="lux-current-price" id="goldPrice">---</span>
                        <span style="font-size: 11px; color: rgba(255,255,255,0.5);">هر انس دلار</span>
                    </div>
                    <div class="lux-chart-canvas-wrapper">
                        <canvas id="goldChart"></canvas>
                    </div>
                </div>

                <!-- CTA Button -->
                <a href="https://web.iranfxapp.ir/" class="lux-cta-btn">
                    <svg class="lux-cta-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor"/>
                        <circle cx="12" cy="7" r="4" stroke="currentColor"/>
                    </svg>
                    <span>ورود به ایران افیکس</span>
                </a>
            </div>

            <!-- Navigation Bar -->
            <nav class="lux-nav-bar">
                <ul class="lux-nav-list">
                    <li class="lux-nav-item">
                        <a href="https://iranfxapp.ir">
                            <svg class="lux-nav-icon" viewBox="0 0 24 24" fill="none">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor"/>
                                <polyline points="9,22 9,12 15,12 15,22" stroke="currentColor"/>
                            </svg>
                            صفحه اصلی
                        </a>
                    </li>
                    <li class="lux-nav-item">
                        <a href="https://iranfxapp.ir/dlapp/">
                            <svg class="lux-nav-icon" viewBox="0 0 24 24" fill="none">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor"/>
                                <polyline points="7,10 12,15 17,10" stroke="currentColor"/>
                                <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor"/>
                            </svg>
                            دانلود اپلیکیشن
                        </a>
                    </li>
                    <li class="lux-nav-item">
                        <a href="https://iranfxapp.ir/economic/">
                            <svg class="lux-nav-icon" viewBox="0 0 24 24" fill="none">
                                <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor"/>
                                <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor"/>
                                <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor"/>
                                <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor"/>
                            </svg>
                            تقویم اقتصادی
                        </a>
                    </li>
                    <li class="lux-nav-item">
                        <a href="https://iranfxapp.ir/akhabar-forex-arzdigital/">
                            <svg class="lux-nav-icon" viewBox="0 0 24 24" fill="none">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor"/>
                                <polyline points="14,2 14,8 20,8" stroke="currentColor"/>
                                <line x1="16" y1="13" x2="8" y2="13" stroke="currentColor"/>
                                <line x1="16" y1="17" x2="8" y2="17" stroke="currentColor"/>
                                <polyline points="10,9 9,9 8,9" stroke="currentColor"/>
                            </svg>
                            بلاگ
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Spacer for fixed header -->
    <div class="lux-header-spacer"></div>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ============================================
            // SCROLL EFFECT
            // ============================================
            const header = document.getElementById('luxHeader');
            let lastScroll = 0;

            window.addEventListener('scroll', function() {
                const currentScroll = window.scrollY;
                
                if (currentScroll > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
                
                lastScroll = currentScroll;
            });

            // ============================================
            // GOLD PRICE CHART with Chart.js
            // ============================================
            const ctx = document.getElementById('goldChart').getContext('2d');
            const goldPriceEl = document.getElementById('goldPrice');
            
            // Gradient for chart line
            const gradient = ctx.createLinearGradient(0, 0, 0, 50);
            gradient.addColorStop(0, 'rgba(255, 215, 0, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');

            // Initialize Chart
            const goldChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'قیمت طلا',
                        data: [],
                        borderColor: '#ffd700',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        pointBackgroundColor: '#ffd700',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 750,
                        easing: 'easeInOutQuart'
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            enabled: true,
                            backgroundColor: 'rgba(10, 14, 26, 0.95)',
                            titleColor: '#ffd700',
                            bodyColor: '#fff',
                            borderColor: 'rgba(255, 215, 0, 0.3)',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y.toFixed(2) + ' دلار';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            display: false,
                            grid: {
                                display: false
                            }
                        },
                        y: {
                            display: false,
                            grid: {
                                display: false
                            },
                            min: 0,
                            max: 0
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });

            // ============================================
            // FETCH GOLD PRICE DATA
            // ============================================
            let priceHistory = [];
            let labelHistory = [];
            const maxDataPoints = 30;

            function toPersianNum(num) {
                const p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
                return num.toString().replace(/\d/g, d => p[d]);
            }

            function formatPrice(price) {
                const formatted = parseFloat(price).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                return toPersianNum(formatted) + ' دلار';
            }

            function updateChart(goldPrice) {
                const now = new Date();
                const timeLabel = now.getHours().toString().padStart(2, '0') + ':' + 
                                 now.getMinutes().toString().padStart(2, '0');

                // Add new data point
                if (priceHistory.length >= maxDataPoints) {
                    priceHistory.shift();
                    labelHistory.shift();
                }

                priceHistory.push(parseFloat(goldPrice));
                labelHistory.push(timeLabel);

                // Update chart data
                goldChart.data.labels = labelHistory;
                goldChart.data.datasets[0].data = priceHistory;

                // Auto-scale Y axis
                const minPrice = Math.min(...priceHistory) * 0.999;
                const maxPrice = Math.max(...priceHistory) * 1.001;
                goldChart.options.scales.y.min = minPrice;
                goldChart.options.scales.y.max = maxPrice;

                goldChart.update('none'); // 'none' for performance

                // Update price display
                goldPriceEl.textContent = formatPrice(goldPrice);
            }

            function fetchGoldPrice() {
                const timestamp = Date.now();
                
                fetch(`https://iranfxapp.ir/trade-gold/backend/gold-price.php?side=buy&t=${timestamp}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.success && data.result && data.result.price) {
                            const price = data.result.price;
                            updateChart(price);
                        }
                    })
                    .catch(error => {
                        console.log('Gold price fetch error:', error);
                    });
            }

            // Initial fetch and interval
            fetchGoldPrice();
            setInterval(fetchGoldPrice, 5000); // Update every 5 seconds

            // ============================================
            // ANIMATE CHART ON LOAD
            // ============================================
            setTimeout(() => {
                if (priceHistory.length > 0) {
                    goldChart.update();
                }
            }, 500);
        });
    </script>
</body>
</html>
