<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایران اِفیکس - هوشمندانه معامله کنید</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 200vh;
        }
        
        .fx-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .fx-header.scrolled {
            background: rgba(15, 23, 42, 0.99);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 215, 0, 0.05);
        }
        
        .fx-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 24px;
        }
        
        .fx-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            gap: 24px;
        }
        
        .fx-brand {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            flex-shrink: 0;
        }
        
        .fx-logo-img {
            height: 50px;
            width: auto;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.3));
            transition: transform 0.3s ease;
        }
        
        .fx-logo-img:hover {
            transform: scale(1.05);
        }
        
        .fx-brand-text {
            display: flex;
            flex-direction: column;
        }
        
        .fx-brand-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 50%, #ffd700 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            letter-spacing: -0.5px;
        }
        
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        
        .fx-brand-subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
            margin-top: 2px;
        }
        
        .fx-chart-section {
            flex: 1;
            max-width: 500px;
            height: 80px;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            padding: 8px 16px;
            overflow: hidden;
        }
        
        .fx-chart-info {
            position: absolute;
            top: 8px;
            right: 16px;
            z-index: 10;
        }
        
        .fx-chart-symbol {
            font-size: 14px;
            font-weight: 700;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .fx-chart-live {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        .fx-chart-price {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        .fx-chart-price.up {
            color: #10b981;
        }
        
        .fx-chart-price.down {
            color: #ef4444;
        }
        
        .fx-chart-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px !important;
        }
        
        .fx-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }
        
        .fx-login-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #0f172a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .fx-login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .fx-login-btn:hover::before {
            left: 100%;
        }
        
        .fx-login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.4);
        }
        
        .fx-login-icon {
            width: 18px;
            height: 18px;
            stroke: #0f172a;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .fx-nav-row {
            padding: 0 0 16px 0;
        }
        
        .fx-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            list-style: none;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .fx-nav li a {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 10px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .fx-nav li a::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            border-radius: 2px;
            transition: transform 0.3s ease;
        }
        
        .fx-nav li a:hover {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.08);
        }
        
        .fx-nav li a:hover::after {
            transform: translateX(-50%) scaleX(1);
        }
        
        .fx-nav-icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .fx-prices-inline {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .fx-price-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        
        .fx-price-badge:hover {
            background: rgba(255, 215, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
        }
        
        .fx-price-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: background 0.3s ease;
        }
        
        .fx-price-dot.active {
            background: #10b981;
            animation: blink 1.5s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .fx-price-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .fx-price-value {
            font-size: 13px;
            font-weight: 700;
            color: #ffd700;
            font-variant-numeric: tabular-nums;
        }
        
        @media (max-width: 1200px) {
            .fx-chart-section {
                max-width: 400px;
            }
        }
        
        @media (max-width: 992px) {
            .fx-top-row {
                flex-wrap: wrap;
                justify-content: center;
                text-align: center;
            }
            
            .fx-brand {
                order: 1;
                width: 100%;
                justify-content: center;
                margin-bottom: 12px;
            }
            
            .fx-chart-section {
                order: 2;
                width: 100%;
                max-width: 100%;
                height: 100px;
            }
            
            .fx-actions {
                order: 3;
                width: 100%;
                justify-content: center;
                margin-top: 12px;
            }
            
            .fx-prices-inline {
                order: 4;
                width: 100%;
                justify-content: center;
                margin-top: 12px;
                flex-wrap: wrap;
            }
        }
        
        @media (max-width: 768px) {
            .fx-container {
                padding: 0 16px;
            }
            
            .fx-logo-img {
                height: 40px;
            }
            
            .fx-brand-title {
                font-size: 20px;
            }
            
            .fx-chart-section {
                height: 80px;
                padding: 6px 12px;
            }
            
            .fx-chart-price {
                font-size: 16px;
            }
            
            .fx-nav {
                flex-wrap: wrap;
                gap: 4px;
            }
            
            .fx-nav li a {
                font-size: 12px;
                padding: 8px 12px;
            }
            
            .fx-login-btn {
                font-size: 12px;
                padding: 10px 18px;
            }
            
            .fx-price-badge {
                padding: 6px 10px;
            }
            
            .fx-price-label {
                font-size: 10px;
            }
            
            .fx-price-value {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <header class="fx-header">
        <div class="fx-container">
            <div class="fx-top-row">
                <a href="https://iranfxapp.ir" class="fx-brand">
                    <img src="https://iranfxapp.ir/wp-content/uploads/2025/11/icon-header.png" alt="ایران اِفیکس" class="fx-logo-img">
                    <div class="fx-brand-text">
                        <span class="fx-brand-title">ایران اِفیکس</span>
                        <span class="fx-brand-subtitle">هوشمندانه معامله کنید</span>
                    </div>
                </a>
                
                <div class="fx-chart-section">
                    <div class="fx-chart-info">
                        <div class="fx-chart-symbol">
                            <span class="fx-chart-live"></span>
                            <span>XAU/USD</span>
                        </div>
                        <div class="fx-chart-price" id="fx-gold-price">---</div>
                    </div>
                    <canvas id="goldChart" class="fx-chart-canvas"></canvas>
                </div>
                
                <div class="fx-actions">
                    <div class="fx-prices-inline">
                        <div class="fx-price-badge">
                            <div class="fx-price-dot" id="fx-usdt-dot"></div>
                            <span class="fx-price-label">تتر</span>
                            <span class="fx-price-value" id="fx-usdt-price">---</span>
                        </div>
                        <div class="fx-price-badge">
                            <div class="fx-price-dot" id="fx-btc-dot"></div>
                            <span class="fx-price-label">بیت‌کوین</span>
                            <span class="fx-price-value" id="fx-btc-price">---</span>
                        </div>
                    </div>
                    
                    <a href="https://web.iranfxapp.ir/" class="fx-login-btn">
                        <svg class="fx-login-icon" viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <span>ورود به ایران افیکس</span>
                    </a>
                </div>
            </div>
            
            <nav class="fx-nav-row">
                <ul class="fx-nav">
                    <li>
                        <a href="https://iranfxapp.ir">
                            <svg class="fx-nav-icon" viewBox="0 0 24 24">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                <polyline points="9 22 9 12 15 12 15 22"/>
                            </svg>
                            صفحه اصلی
                        </a>
                    </li>
                    <li>
                        <a href="https://iranfxapp.ir/dlapp/">
                            <svg class="fx-nav-icon" viewBox="0 0 24 24">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            دانلود اپلیکیشن
                        </a>
                    </li>
                    <li>
                        <a href="https://iranfxapp.ir/economic/">
                            <svg class="fx-nav-icon" viewBox="0 0 24 24">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                <line x1="16" y1="2" x2="16" y2="6"/>
                                <line x1="8" y1="2" x2="8" y2="6"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                            </svg>
                            تقویم اقتصادی
                        </a>
                    </li>
                    <li>
                        <a href="https://iranfxapp.ir/akhabar-forex-arzdigital/">
                            <svg class="fx-nav-icon" viewBox="0 0 24 24">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="16" y1="13" x2="8" y2="13"/>
                                <line x1="16" y1="17" x2="8" y2="17"/>
                                <polyline points="10 9 9 9 8 9"/>
                            </svg>
                            بلاگ
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Scroll effect
            const header = document.querySelector('.fx-header');
            window.addEventListener('scroll', function() {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });

            // Chart.js setup for Gold (XAU/USD)
            const ctx = document.getElementById('goldChart').getContext('2d');
            const priceEl = document.getElementById('fx-gold-price');
            
            // Generate gradient for chart
            const gradient = ctx.createLinearGradient(0, 0, 0, 50);
            gradient.addColorStop(0, 'rgba(255, 215, 0, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');

            let goldChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'XAU/USD',
                        data: [],
                        borderColor: '#ffd700',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        pointHoverBackgroundColor: '#ffd700',
                        pointHoverBorderColor: '#fff',
                        pointHoverBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            enabled: true,
                            backgroundColor: 'rgba(15, 23, 42, 0.95)',
                            titleColor: '#ffd700',
                            bodyColor: '#fff',
                            borderColor: 'rgba(255, 215, 0, 0.3)',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return '$' + context.parsed.y.toFixed(2);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            display: false,
                            grid: {
                                display: false
                            }
                        },
                        y: {
                            display: false,
                            grid: {
                                display: false
                            },
                            min: 0,
                            max: 0
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    animation: {
                        duration: 0
                    }
                }
            });

            // Price data storage
            let priceHistory = [];
            let lastPrice = null;

            function toPersianNum(num) {
                const p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
                return num.toString().replace(/\d/g, d => p[d]);
            }

            function formatGoldPrice(price) {
                return '$' + toPersianNum(price.toFixed(2));
            }

            function formatToman(rial) {
                const t = Math.floor(rial / 10);
                return toPersianNum(t.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",")) + " تومان";
            }

            function formatDollar(usd) {
                return toPersianNum(parseFloat(usd).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",")) + " دلار";
            }

            function updateChart(newPrice) {
                const now = new Date().toLocaleTimeString('fa-IR');
                
                if (priceHistory.length > 50) {
                    priceHistory.shift();
                    goldChart.data.labels.shift();
                }
                
                priceHistory.push(newPrice);
                goldChart.data.labels.push(now);
                goldChart.data.datasets[0].data.push(newPrice);
                
                // Update Y axis scale
                const minPrice = Math.min(...priceHistory) * 0.999;
                const maxPrice = Math.max(...priceHistory) * 1.001;
                goldChart.options.scales.y.min = minPrice;
                goldChart.options.scales.y.max = maxPrice;
                
                // Update price display with color
                if (lastPrice !== null) {
                    if (newPrice > lastPrice) {
                        priceEl.className = 'fx-chart-price up';
                    } else if (newPrice < lastPrice) {
                        priceEl.className = 'fx-chart-price down';
                    }
                }
                
                priceEl.textContent = formatGoldPrice(newPrice);
                lastPrice = newPrice;
                
                goldChart.update();
            }

            function fetchGoldPrice() {
                fetch('https://api.gold-api.com/price/XAU')
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.price) {
                            updateChart(parseFloat(data.price));
                        }
                    })
                    .catch(() => {
                        // Fallback to random price simulation for demo
                        const basePrice = 2650 + (Math.random() - 0.5) * 10;
                        updateChart(basePrice);
                    });
            }

            // Initialize chart with some data
            for (let i = 0; i < 30; i++) {
                const simulatedPrice = 2650 + (Math.random() - 0.5) * 20;
                priceHistory.push(simulatedPrice);
                goldChart.data.labels.push('');
                goldChart.data.datasets[0].data.push(simulatedPrice);
            }
            goldChart.update();
            
            // Fetch real price immediately
            fetchGoldPrice();
            
            // Update every 5 seconds
            setInterval(fetchGoldPrice, 5000);

            // Other prices (USDT, BTC)
            const usdtEl = document.getElementById('fx-usdt-price');
            const btcEl = document.getElementById('fx-btc-price');
            const usdtDot = document.getElementById('fx-usdt-dot');
            const btcDot = document.getElementById('fx-btc-dot');

            let cache = { usdt: null, btc: null, timestamp: 0 };
            const CACHE_DURATION = 30000;

            function updateUI() {
                if (cache.usdt) {
                    usdtEl.textContent = cache.usdt;
                    usdtDot.classList.add('active');
                }
                if (cache.btc) {
                    btcEl.textContent = cache.btc;
                    btcDot.classList.add('active');
                }
            }

            function fetchOtherPrices() {
                const now = Date.now();
                if (now - cache.timestamp < CACHE_DURATION && cache.usdt && cache.btc) {
                    updateUI();
                    return;
                }

                Promise.all([
                    fetch('https://iranfxapp.ir/proxy/proxy.php?t=' + now).then(r => r.json()).catch(() => null)
                ]).then(([proxyData]) => {
                    if (proxyData) {
                        if (proxyData.USDTIRT && !isNaN(proxyData.USDTIRT) && parseFloat(proxyData.USDTIRT) > 0) {
                            cache.usdt = formatToman(parseFloat(proxyData.USDTIRT));
                        }
                        if (proxyData.BTCUSDT && !isNaN(proxyData.BTCUSDT) && parseFloat(proxyData.BTCUSDT) > 0) {
                            cache.btc = formatDollar(parseFloat(proxyData.BTCUSDT));
                        }
                    }
                    cache.timestamp = now;
                    updateUI();
                });
            }

            fetchOtherPrices();
            setInterval(fetchOtherPrices, 30000);
            updateUI();
        });
    </script>
</body>
</html>
