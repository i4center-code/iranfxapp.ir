<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IranFX - هدر حرفه‌ای فارکس</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 200vh;
        }

        /* Header Container */
        .fx-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fx-header.scrolled {
            background: rgba(15, 23, 42, 0.98);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .fx-header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
        }

        /* Top Row: Logo + Nav + CTA */
        .fx-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }

        /* Logo Section - Fixed 45x45 */
        .fx-logo {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }

        .fx-logo-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .fx-logo-text {
            display: flex;
            flex-direction: column;
        }

        .fx-brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700 0%, #ffb700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .fx-tagline {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        /* Navigation */
        .fx-nav {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .fx-nav-list {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .fx-nav-item {
            position: relative;
        }

        .fx-nav-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .fx-nav-link:hover {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        .fx-nav-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .fx-nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ffd700, #ffb700);
            transform: translateX(-50%);
            transition: width 0.3s ease;
        }

        .fx-nav-link:hover::after {
            width: 80%;
        }

        /* CTA Button */
        .fx-cta-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #ffd700 0%, #ffb700 100%);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            flex-shrink: 0;
        }

        .fx-cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        .fx-cta-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Bottom Row: Live Chart + Prices */
        .fx-header-bottom {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 2rem;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Chart Section */
        .fx-chart-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .fx-chart-info {
            flex-shrink: 0;
        }

        .fx-chart-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }

        .fx-chart-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e2e8f0;
            font-family: 'Vazirmatn', sans-serif;
        }

        .fx-chart-change {
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.25rem;
        }

        .fx-chart-change.positive {
            color: #10b981;
        }

        .fx-chart-change.negative {
            color: #ef4444;
        }

        .fx-chart-wrapper {
            flex: 1;
            height: 60px;
            position: relative;
        }

        /* Live Prices */
        .fx-prices {
            display: flex;
            gap: 2rem;
            flex-shrink: 0;
        }

        .fx-price-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .fx-price-label {
            font-size: 0.75rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .fx-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #64748b;
            transition: background 0.3s ease;
        }

        .fx-status-dot.active {
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }

        .fx-price-value {
            font-size: 1rem;
            font-weight: 700;
            color: #e2e8f0;
            font-family: 'Vazirmatn', sans-serif;
        }

        .fx-price-currency {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 400;
            margin-right: 0.25rem;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .fx-header-top {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .fx-nav {
                order: 3;
                width: 100%;
                justify-content: center;
            }

            .fx-nav-list {
                gap: 1rem;
            }

            .fx-header-bottom {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .fx-prices {
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .fx-header-content {
                padding: 1rem;
            }

            .fx-header-top {
                flex-direction: column;
                align-items: stretch;
            }

            .fx-logo {
                justify-content: center;
            }

            .fx-nav-list {
                justify-content: center;
                flex-wrap: wrap;
            }

            .fx-cta-btn {
                justify-content: center;
            }

            .fx-chart-container {
                flex-direction: column;
                align-items: stretch;
            }

            .fx-chart-wrapper {
                height: 50px;
            }

            .fx-prices {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

<header class="fx-header" id="fxHeader">
    <div class="fx-header-content">
        <!-- Top Row -->
        <div class="fx-header-top">
            <!-- Logo -->
            <div class="fx-logo">
                <img src="https://iranfxapp.ir/logo.png" alt="IranFX" class="fx-logo-img" width="45" height="45">
                <div class="fx-logo-text">
                    <span class="fx-brand-name">ایران افیکس</span>
                    <span class="fx-tagline">پلتفرم حرفه‌ای معاملات فارکس</span>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="fx-nav">
                <ul class="fx-nav-list">
                    <li class="fx-nav-item">
                        <a href="#" class="fx-nav-link">
                            <svg class="fx-nav-icon" viewBox="0 0 24 24">
                                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                            </svg>
                            صفحه اصلی
                        </a>
                    </li>
                    <li class="fx-nav-item">
                        <a href="#" class="fx-nav-link">
                            <svg class="fx-nav-icon" viewBox="0 0 24 24">
                                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                            </svg>
                            دانلود اپلیکیشن
                        </a>
                    </li>
                    <li class="fx-nav-item">
                        <a href="#" class="fx-nav-link">
                            <svg class="fx-nav-icon" viewBox="0 0 24 24">
                                <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/>
                            </svg>
                            تقویم اقتصادی
                        </a>
                    </li>
                    <li class="fx-nav-item">
                        <a href="#" class="fx-nav-link">
                            <svg class="fx-nav-icon" viewBox="0 0 24 24">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                            </svg>
                            بلاگ
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- CTA Button -->
            <button class="fx-cta-btn">
                <svg class="fx-cta-icon" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                ورود به حساب
            </button>
        </div>

        <!-- Bottom Row: Chart + Prices -->
        <div class="fx-header-bottom">
            <!-- Live Chart -->
            <div class="fx-chart-container">
                <div class="fx-chart-info">
                    <div class="fx-chart-label">طلای جهانی (XAU/USD)</div>
                    <div class="fx-chart-price" id="fxGoldPrice">$0</div>
                    <div class="fx-chart-change" id="fxGoldChange">0%</div>
                </div>
                <div class="fx-chart-wrapper">
                    <canvas id="fxGoldChart"></canvas>
                </div>
            </div>

            <!-- Live Prices -->
            <div class="fx-prices">
                <div class="fx-price-item">
                    <div class="fx-price-label">
                        <span class="fx-status-dot" id="fxUsdtStatus"></span>
                        تتر (USDT)
                    </div>
                    <div class="fx-price-value" id="fxUsdtPrice">--</div>
                </div>
                <div class="fx-price-item">
                    <div class="fx-price-label">
                        <span class="fx-status-dot" id="fxBtcStatus"></span>
                        بیت‌کوین (BTC)
                    </div>
                    <div class="fx-price-value" id="fxBtcPrice">--</div>
                </div>
                <div class="fx-price-item">
                    <div class="fx-price-label">
                        <span class="fx-status-dot" id="fxGoldTickerStatus"></span>
                        طلا (تومان)
                    </div>
                    <div class="fx-price-value" id="fxGoldTickerPrice">--</div>
                </div>
            </div>
        </div>
    </div>
</header>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Scroll effect
        const header = document.getElementById('fxHeader');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // Persian number converter
        function toPersianNum(num) {
            const p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
            return num.toString().replace(/\d/g, d => p[d]);
        }

        // Format functions
        function formatToman(rial) {
            const t = Math.floor(rial / 10);
            return toPersianNum(t.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","));
        }

        function formatDollar(usd) {
            return toPersianNum(parseFloat(usd).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ","));
        }

        function formatGoldPrice(price) {
            return toPersianNum(parseFloat(price).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ","));
        }

        // Chart.js setup for XAU/USD
        const ctx = document.getElementById('fxGoldChart').getContext('2d');
        const goldChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'XAU/USD',
                    data: [],
                    borderColor: '#ffd700',
                    backgroundColor: 'rgba(255,215,0,0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                },
                scales: {
                    x: { display: false },
                    y: { 
                        display: false,
                        min: 0,
                        max: 3000
                    }
                },
                animation: {
                    duration: 500,
                    easing: 'easeOutQuart'
                },
                interaction: { intersect: false }
            }
        });

        // Price data storage
        let priceCache = { usdt: null, btc: null, gold: null, timestamp: 0 };
        const CACHE_DURATION = 30000;
        let goldPrices = [];
        let goldLabels = [];
        let previousGoldPrice = null;

        // Update UI elements
        function updateUI() {
            if (priceCache.usdt) {
                document.getElementById('fxUsdtPrice').innerHTML = priceCache.usdt + '<span class="fx-price-currency">تومان</span>';
                document.getElementById('fxUsdtStatus').classList.add('active');
            }
            if (priceCache.btc) {
                document.getElementById('fxBtcPrice').innerHTML = priceCache.btc + '<span class="fx-price-currency">$</span>';
                document.getElementById('fxBtcStatus').classList.add('active');
            }
            if (priceCache.gold) {
                document.getElementById('fxGoldTickerPrice').innerHTML = priceCache.gold + '<span class="fx-price-currency">تومان</span>';
                document.getElementById('fxGoldTickerStatus').classList.add('active');
            }
        }

        // Fetch prices from APIs
        function fetchAllPrices() {
            const now = Date.now();
            
            // Use cache if valid
            if (now - priceCache.timestamp < CACHE_DURATION && priceCache.usdt && priceCache.btc && priceCache.gold) {
                updateUI();
                return;
            }

            Promise.all([
                fetch('https://iranfxapp.ir/proxy/proxy.php?t=' + now)
                    .then(r => r.json())
                    .catch(() => null),
                fetch('https://iranfxapp.ir/trade-gold/backend/gold-price.php?side=buy&t=' + now)
                    .then(r => r.json())
                    .catch(() => null)
            ]).then(([proxyData, goldData]) => {
                // Process USDT and BTC
                if (proxyData) {
                    if (proxyData.USDTIRT && !isNaN(proxyData.USDTIRT) && parseFloat(proxyData.USDTIRT) > 0) {
                        priceCache.usdt = formatToman(parseFloat(proxyData.USDTIRT));
                    }
                    if (proxyData.BTCUSDT && !isNaN(proxyData.BTCUSDT) && parseFloat(proxyData.BTCUSDT) > 0) {
                        priceCache.btc = formatDollar(parseFloat(proxyData.BTCUSDT));
                    }
                }
                
                // Process Gold price
                if (goldData && goldData.success && goldData.result && goldData.result.price) {
                    const goldPrice = parseFloat(goldData.result.price);
                    priceCache.gold = formatGoldPrice(goldPrice);
                    
                    // Update chart display
                    document.getElementById('fxGoldPrice').textContent = '$' + formatGoldPrice(goldPrice / 85000); // Approximate USD conversion
                    
                    // Calculate change
                    if (previousGoldPrice !== null) {
                        const change = ((goldPrice - previousGoldPrice) / previousGoldPrice) * 100;
                        const changeEl = document.getElementById('fxGoldChange');
                        if (change >= 0) {
                            changeEl.textContent = '+' + toPersianNum(change.toFixed(2)) + '%';
                            changeEl.className = 'fx-chart-change positive';
                        } else {
                            changeEl.textContent = toPersianNum(change.toFixed(2)) + '%';
                            changeEl.className = 'fx-chart-change negative';
                        }
                    }
                    previousGoldPrice = goldPrice;
                    
                    // Update chart data
                    const timeLabel = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
                    goldLabels.push(timeLabel);
                    goldPrices.push(goldPrice);
                    
                    // Keep only last 20 points
                    if (goldLabels.length > 20) {
                        goldLabels.shift();
                        goldPrices.shift();
                    }
                    
                    goldChart.data.labels = goldLabels;
                    goldChart.data.datasets[0].data = goldPrices;
                    
                    // Auto-scale Y axis
                    const minPrice = Math.min(...goldPrices) * 0.999;
                    const maxPrice = Math.max(...goldPrices) * 1.001;
                    goldChart.options.scales.y.min = minPrice;
                    goldChart.options.scales.y.max = maxPrice;
                    
                    goldChart.update('none'); // Smooth update without full animation
                }
                
                priceCache.timestamp = now;
                updateUI();
            }).catch(err => {
                console.log('Error fetching prices:', err);
            });
        }

        // Initial fetch and interval
        fetchAllPrices();
        setInterval(fetchAllPrices, 5000); // Update every 5 seconds
        updateUI();
    });
</script>

</body>
</html>
