<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایران اِفیکس - هوشمندانه معامله کنید</title>
    <style>
        .iw-body-reset {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'IranSans', sans-serif;
        }
        body .iw-body-reset {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
            direction: rtl;
        }
        .iw-header-wrapper {
            position: relative;
            width: 100%;
            z-index: 1000;
        }
        .iw-primary-header {
            background: linear-gradient(135deg, #1a2a6c, #2c3e50);
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            transition: all 0.3s ease;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .iw-primary-header.iw-scrolled {
            background: rgba(26, 42, 108, 0.95);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .iw-header-row1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            max-width: 1400px;
            margin: 0 auto;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .iw-header-row2 {
            padding: 8px 20px;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
        }
        .iw-brand-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            gap: 12px;
            flex-shrink: 0;
        }
        .iw-logo-image {
            height: 45px;
            width: auto;
            object-fit: contain;
            max-height: 45px !important;
            max-width: 150px !important;
        }
        .iw-brand-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .iw-brand-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .iw-brand-subtitle {
            font-size: 12px;
            opacity: 0.9;
            color: rgba(255,255,255,0.85);
        }
        .iw-prices-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .iw-price-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
        }
        .iw-price-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #27ae60;
            animation: iw-blink 1.5s infinite;
        }
        @keyframes iw-blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .iw-price-label {
            color: rgba(255,255,255,0.7);
            font-size: 11px;
        }
        .iw-price-value {
            color: #facc15;
            font-weight: 700;
            font-size: 13px;
        }
        .iw-login-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a2a6c !important;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 20px;
            border-radius: 25px;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(255,215,0,0.3);
            flex-shrink: 0;
        }
        .iw-login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255,215,0,0.4);
            background: linear-gradient(135deg, #ffe44d, #ffa333);
        }
        .iw-login-btn-icon {
            width: 16px;
            height: 16px;
            stroke: #1a2a6c;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .iw-primary-nav {
            display: flex !important;
            align-items: center;
            gap: 12px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .iw-primary-nav li a {
            display: flex;
            align-items: center;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .iw-primary-nav li a:hover {
            color: #ffd700;
            background: rgba(255,255,255,0.1);
        }
        .iw-mobile-trigger, .iw-mobile-panel, .iw-contact-link, .iw-login-link, .iw-nav-icon {
            display: none !important;
        }
        #AA75-price-container-wrapper, #AA75-gold-chart-container {
            all: initial;
            display: contents;
        }
        @media (max-width: 768px) {
            .iw-header-row1 {
                padding: 8px 12px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .iw-brand-title {
                font-size: 18px;
            }
            .iw-brand-subtitle {
                font-size: 10px;
            }
            .iw-logo-image {
                height: 35px !important;
                max-height: 35px !important;
            }
            .iw-prices-row {
                order: 3;
                width: 100%;
                justify-content: center;
                gap: 4px;
            }
            .iw-price-item {
                padding: 4px 10px;
                font-size: 11px;
            }
            .iw-price-value {
                font-size: 11px;
            }
            .iw-login-btn {
                font-size: 12px;
                padding: 6px 14px;
            }
            .iw-header-row2 {
                padding: 6px 12px;
            }
            .iw-primary-nav {
                gap: 6px;
            }
            .iw-primary-nav li a {
                font-size: 14px;
                padding: 6px 12px;
            }
        }
        @media (max-width: 480px) {
            .iw-primary-nav li a {
                font-size: 13px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body class="iw-body-reset">
    <div class="iw-header-wrapper">
        <header class="iw-primary-header">
            <div class="iw-header-row1">
                <a href="https://iranfxapp.ir" class="iw-brand-logo">
                    <img src="https://iranfxapp.ir/wp-content/uploads/2025/11/icon-header.png" alt="ایران اِفیکس" class="iw-logo-image">
                    <div class="iw-brand-text">
                        <span class="iw-brand-title">ایران اِفیکس</span>
                        <span class="iw-brand-subtitle">هوشمندانه معامله کنید</span>
                    </div>
                </a>
                <div class="iw-prices-row">
                    <div class="iw-price-item">
                        <div class="iw-price-dot" id="iw-usdt-dot"></div>
                        <span class="iw-price-label">تتر</span>
                        <span class="iw-price-value" id="iw-usdt-price">---</span>
                    </div>
                    <div class="iw-price-item">
                        <div class="iw-price-dot" id="iw-btc-dot"></div>
                        <span class="iw-price-label">بیت‌کوین</span>
                        <span class="iw-price-value" id="iw-btc-price">---</span>
                    </div>
                    <div class="iw-price-item">
                        <div class="iw-price-dot" id="iw-gold-dot"></div>
                        <span class="iw-price-label">طلا (گرم)</span>
                        <span class="iw-price-value" id="iw-gold-price">---</span>
                    </div>
                </div>
                <a href="https://web.iranfxapp.ir/" class="iw-login-btn">
                    <svg class="iw-login-btn-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
                    </svg>
                    <span>ورود به ایران افیکس</span>
                </a>
            </div>
            <div class="iw-header-row2">
                <nav>
                    <ul class="iw-primary-nav">
                        <li><a href="https://iranfxapp.ir">صفحه اصلی</a></li>
                        <li><a href="https://iranfxapp.ir/dlapp/">دانلود اپلیکیشن</a></li>
                        <li><a href="https://iranfxapp.ir/economic/">تقویم اقتصادی</a></li>
                        <li><a href="https://iranfxapp.ir/akhabar-forex-arzdigital/">بلاگ</a></li>
                    </ul>
                </nav>
            </div>
        </header>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const header = document.querySelector('.iw-primary-header');
            window.addEventListener('scroll', function() {
                if (window.scrollY > 50) {
                    header.classList.add('iw-scrolled');
                } else {
                    header.classList.remove('iw-scrolled');
                }
            });

            const usdtEl = document.getElementById('iw-usdt-price');
            const btcEl = document.getElementById('iw-btc-price');
            const goldEl = document.getElementById('iw-gold-price');
            const usdtDot = document.getElementById('iw-usdt-dot');
            const btcDot = document.getElementById('iw-btc-dot');
            const goldDot = document.getElementById('iw-gold-dot');

            function toPersianNum(num) {
                const p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
                return num.toString().replace(/\d/g, d => p[d]);
            }
            function formatToman(rial) {
                const t = Math.floor(rial / 10);
                return toPersianNum(t.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",")) + " تومان";
            }
            function formatDollar(usd) {
                return toPersianNum(parseFloat(usd).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",")) + " دلار";
            }
            function formatGold(price) {
                return toPersianNum(parseInt(price).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",")) + " تومان";
            }

            let cache = { usdt: null, btc: null, gold: null, timestamp: 0 };
            const CACHE_DURATION = 30000;

            function updateUI() {
                if (cache.usdt) {
                    usdtEl.textContent = cache.usdt;
                    usdtDot.style.backgroundColor = '#27ae60';
                }
                if (cache.btc) {
                    btcEl.textContent = cache.btc;
                    btcDot.style.backgroundColor = '#27ae60';
                }
                if (cache.gold) {
                    goldEl.textContent = cache.gold;
                    goldDot.style.backgroundColor = '#27ae60';
                }
            }

            function fetchAllPrices() {
                const now = Date.now();
                if (now - cache.timestamp < CACHE_DURATION && cache.usdt && cache.btc && cache.gold) {
                    updateUI();
                    return;
                }

                Promise.all([
                    fetch('https://iranfxapp.ir/proxy/proxy.php?t=' + now).then(r => r.json()).catch(() => null),
                    fetch('https://iranfxapp.ir/trade-gold/backend/gold-price.php?side=buy&t=' + now).then(r => r.json()).catch(() => null)
                ]).then(([proxyData, goldData]) => {
                    if (proxyData) {
                        if (proxyData.USDTIRT && !isNaN(proxyData.USDTIRT) && parseFloat(proxyData.USDTIRT) > 0) {
                            cache.usdt = formatToman(parseFloat(proxyData.USDTIRT));
                        }
                        if (proxyData.BTCUSDT && !isNaN(proxyData.BTCUSDT) && parseFloat(proxyData.BTCUSDT) > 0) {
                            cache.btc = formatDollar(parseFloat(proxyData.BTCUSDT));
                        }
                    }
                    if (goldData && goldData.success) {
                        cache.gold = formatGold(goldData.result.price);
                    }
                    cache.timestamp = now;
                    updateUI();
                });
            }

            fetchAllPrices();
            setInterval(fetchAllPrices, 30000);
            updateUI();
        });
    </script>
</body>
</html>
